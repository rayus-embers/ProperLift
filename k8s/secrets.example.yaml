# REFERENCE ONLY - not applied by kustomize. Shows the shape of the Secrets
# that scripts/03-create-secrets.sh generates with random values.
# Never commit real values: anyone with read access to the repo would get them.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: properlift
type: Opaque
stringData:
  root-username: root
  root-password: <random hex>
  app-password: <random hex>
  keyfile: <random base64, shared by the 3 replica-set members>
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: properlift
type: Opaque
stringData:
  rpc-secret: <64 hex chars, shared by the 3 Garage nodes>
  admin-token: <random>
  metrics-token: <random>
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: properlift
type: Opaque
stringData:
  MONGO_URI: mongodb://properlift:<app-password>@mongo-0.mongo-hl.properlift.svc.cluster.local:27017,mongo-1...,mongo-2.../properlift?replicaSet=rs0&authSource=properlift
  JWT_SECRET: <96 hex chars>
  S3_ACCESS_KEY: GK<24 hex chars>
  S3_SECRET_KEY: <64 hex chars>
  SEED_COACH_EMAIL: coach@properlift.local
  SEED_COACH_PASSWORD: <random>
