# Garage: self-hosted S3-compatible object storage (videos, photos).
# 3 nodes, one per Kubernetes node, every object replicated 3 times.
# Not exposed outside the cluster: the backend writes through the S3 API
# (port 3900), the media service reads through the web endpoint (port 3902).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: garage-hl
  labels:
    app: garage
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    app: garage
spec:
  type: ClusterIP
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: web
      port: 3902
      targetPort: 3902
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app: garage
spec:
  serviceName: garage-hl
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      serviceAccountName: garage
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: garage
              topologyKey: kubernetes.io/hostname
      containers:
        - name: garage
          image: dxflrs/garage:v2.2.0
          imagePullPolicy: IfNotPresent
          command: ["/garage", "server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: { name: garage-secrets, key: rpc-secret }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: garage-secrets, key: admin-token }
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: garage-secrets, key: metrics-token }
            - name: RUST_LOG
              value: garage=info
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: web, containerPort: 3902 }
            - { name: admin, containerPort: 3903 }
          readinessProbe:
            tcpSocket: { port: 3900 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3901 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: garage-config   # generated by kustomize from garage.toml (name gets a hash suffix)
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garage
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: garage
